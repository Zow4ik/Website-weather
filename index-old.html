<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>website-weather</title>
  </head>
  <body>
    <main class="wrapper">
      <section class="weather-details">
        <div class="weather-details__forecast">
          <h2 class="weather-details__title">Week</h2>
          <ul data-js-block-forecast class="weather-details__cards">
          </ul>
        </div>
        <div class="weather-details__overview">
          <h2 class="weather-details__overview-title-block">Today’s Overview</h2>
          <ul class="weather-details__overview-cards">
            <li class="weather-details__overview-card card">
              <h3 class="weather-details__overview-title">Air Quality Index</h3>
              <span class="weather-details__overview-num" data-js-air-index></span>
              <div class="weather-details__overview-state">
                <span data-js-air-state></span>
                <img
                  src="/public/images/air.webp"
                  alt=""
                  width="70"
                  height="70"
                  loading="lazy"
                />
              </div>
            </li>
            <li class="weather-details__overview-card card">
              <h3 class="weather-details__overview-title">UV Index</h3>
              <span class="weather-details__overview-num" data-js-uv-index></span>
              <div class="weather-details__overview-state">
                <span data-js-uv-state></span>
                <img
                  src="/public/images/uv.webp"
                  alt=""
                  width="70"
                  height="70"
                  loading="lazy"
                />
              </div>
            </li>
            <li class="weather-details__overview-card card">
              <h3 class="weather-details__overview-title">Pressure (hpa)</h3>
              <span class="weather-details__overview-num" data-js-hpa-index></span>
              <div class="weather-details__overview-state">
                <span data-js-hpa-state></span>
                <img
                  src="/public/images/hpa.webp"
                  alt=""
                  width="70"
                  height="70"
                  loading="lazy"
                />
              </div>
            </li>
            <li class="weather-details__overview-card card card--big">
              <h3 class="weather-details__overview-title">Precipitation</h3>
              <canvas data-js-precipitation></canvas>
            </li>
            <li class="weather-details__overview-card card">
              <h3 class="weather-details__overview-title">Sunrise & Sunset</h3>
              <div class="weather-details__overview-sunrise">
                <img
                  src="/public/images/sunrise.svg"
                  alt=""
                  width="48"
                  height="48"
                  loading="lazy"
                />
                <div class="weather-details__overview-content">
                  <span class="weather-details__overview-sun">Sunrise</span>
                  <span class="weather-details__overview-time" data-js-sunrise></span>
                </div>
              </div>
              <div class="weather-details__overview-sunset">
                <img
                  src="/public/images/sunset.svg"
                  alt=""
                  width="48"
                  height="48"
                  loading="lazy"
                />
                <div class="weather-details__overview-content">
                  <span class="weather-details__overview-sun">Sunset</span>
                  <span class="weather-details__overview-time" data-js-sunset></span>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <script type="module" src="/src/scripts/main.js"></script>
  </body>
</html>
